name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s agent-platform/tests
      - name: Validate skills
        run: python agent-platform/build_agent_plugins.py validate-skills
      - name: Inventory
        run: python agent-platform/build_agent_plugins.py inventory
      - name: Build and verify generated packs
        run: |
          python agent-platform/build_agent_plugins.py build-plugins --clean
          python agent-platform/build_agent_plugins.py validate-generated
      - name: Bootstrap script syntax
        run: bash -n bootstrap.sh

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: platforma_onboarding_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_test -d platforma_onboarding_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Validate route registries
        run: |
          python -m json.tool gateway-tools.json > /dev/null
          python -m json.tool gateway-policy.json > /dev/null
          python -m json.tool gateway-company-indexes.json > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Connection download browser logic (synthetic, no network)
        run: node --test tests-js/connection-download.test.cjs
      - name: Compile all modules
        run: >-
          python -m compileall -q gateway_mcp gateway.py gateway_access.py gateway_auth.py
          gateway_backends.py gateway_company.py gateway_memory.py gateway_migrations.py
          gateway_observability.py gateway_policy.py gateway_storage.py
      - name: Fetch and hash-check official Bitrix24 SDK
        run: python release/fetch-sdk.py --source-root .
      - name: All test modules with disposable database and isolated imports
        env:
          ONBOARDING_TEST_DATABASE_URL: postgresql://ci_test:synthetic-ci-only@127.0.0.1:5432/platforma_onboarding_test
        run: python release/run-suite.py --require-database --output "$RUNNER_TEMP/gateway-tests"
      - name: Synthetic standalone roundtrips
        env:
          ONBOARDING_TEST_DATABASE_URL: postgresql://ci_test:synthetic-ci-only@127.0.0.1:5432/platforma_onboarding_test
        run: python release/run-roundtrips.py --output "$RUNNER_TEMP/gateway-roundtrips"
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gateway-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gateway-tests/*
            ${{ runner.temp }}/gateway-roundtrips/*
          retention-days: 7
