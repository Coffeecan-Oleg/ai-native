name: Corporate Gateway pinned release
on:
  pull_request:
    paths: ['gateway/**', '.github/workflows/corporate-release.yml', '.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build fixed inputs without Gateway overlay layers
        run: docker build --platform linux/amd64 --pull=false -t gateway-corporate-ci gateway
      - name: Verify installed source and dependencies
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true
          gateway-corporate-ci python /usr/local/share/gateway-release/verify-image.py
      - name: Corporate and metrics regression on installed wheel
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --memory 384m --pids-limit 96
          --tmpfs /tmp:rw,nosuid,nodev,size=96m
          -v "$PWD/gateway:/checks:ro"
          gateway-corporate-ci python /checks/release/run-tests.py
