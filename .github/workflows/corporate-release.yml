name: Corporate Gateway pinned release
on:
  push:
    branches: ['delivery/platforma-*']
  pull_request:
    paths: ['gateway/**', 'tools/platforma-workflow/**', '.github/workflows/corporate-release.yml', '.gitattributes']
  workflow_dispatch:
    inputs:
      export_image:
        description: 'Export the accepted image artifact; does not deploy to a server'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: corporate-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pinned-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DOCKER_HOST: unix:///var/run/docker.sock
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-11-04
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Connection download browser logic (synthetic, no network)
        run: node --test gateway/tests-js/connection-download.test.cjs
      - name: Test CI guard and cleanup logic without Docker operations
        run: |
          python3 -m unittest discover -s gateway/release -p test_ci_check.py
          python3 -m unittest discover -s gateway/release -p test_build_watchdog.py
          python3 -m unittest discover -s gateway/release -p test_apt_transport.py
          python3 -m unittest discover -s gateway/release -p test_apt_mirrors.py
          python3 -m unittest discover -s gateway/release -p test_export_image.py
      - name: Test development and scoped release tooling
        working-directory: tools/platforma-workflow
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check separate builder resources before building
        run: python3 gateway/release/ci-check.py preflight --reports "$RUNNER_TEMP/gateway-ci-report"
      - name: Build fixed inputs without Gateway overlay layers
        timeout-minutes: 20
        run: python3 gateway/release/build-image.py --reports "$RUNNER_TEMP/gateway-ci-report"
      - name: Verify installed image, regression and empty isolated database
        run: python3 gateway/release/ci-check.py checks --image gateway-corporate-ci --reports "$RUNNER_TEMP/gateway-ci-report"
      - name: Save check reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, resolved 2026-11-04
        with:
          name: gateway-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gateway-ci-report/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Export accepted source-only image after explicit artifact request
        if: github.repository == 'Coffeecan-Oleg/ai-native' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/delivery/platforma-')) || (github.event_name == 'workflow_dispatch' && inputs.export_image))
        run: python3 gateway/release/export-image.py --reports "$RUNNER_TEMP/gateway-ci-report" --out "$RUNNER_TEMP/platforma-delivery"
      - name: Deliver accepted image for seven days, without production data
        if: github.repository == 'Coffeecan-Oleg/ai-native' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/delivery/platforma-')) || (github.event_name == 'workflow_dispatch' && inputs.export_image))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: platforma-image-${{ github.sha }}
          path: ${{ runner.temp }}/platforma-delivery/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
