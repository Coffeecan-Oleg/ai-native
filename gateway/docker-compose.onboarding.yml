# Apply after docker-compose.yml, docker-compose.platforma.yml and docker-compose.addons.yml.
# Exact owner and expiry belong in the private .env, never in this public file.
services:
  gateway:
    environment:
      GATEWAY_PLATFORMA_ONBOARDING_ENABLED: ${GATEWAY_PLATFORMA_ONBOARDING_ENABLED:-false}
      GATEWAY_PLATFORMA_OWNER_SUBJECT: ${GATEWAY_PLATFORMA_OWNER_SUBJECT:-}
      GATEWAY_PLATFORMA_READER_UNTIL: ${GATEWAY_PLATFORMA_READER_UNTIL:-}
